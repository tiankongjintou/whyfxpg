# WHYFXPG Phase 1 一键部署（P06）
# 服务:api(8000) + worker(采集管道) + postgres:16 + redis:7 + minio(S3)
# 用法: docker compose up -d
# 参考: docs/技术改造路线图.md §7 部署架构

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: whyfxpg
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-whyfxpg}
      POSTGRES_DB: whyfxpg
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U whyfxpg -d whyfxpg"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # 控制台
    volumes:
      - s3data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://whyfxpg:${POSTGRES_PASSWORD:-whyfxpg}@db:5432/whyfxpg
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: ${SECRET_KEY:-change-me-in-production}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: api/Dockerfile
    command: python -m whyfxpg.worker
    environment:
      DATABASE_URL: postgresql://whyfxpg:${POSTGRES_PASSWORD:-whyfxpg}@db:5432/whyfxpg
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: ${SECRET_KEY:-change-me-in-production}
      WHYFXPG_WORKER_INTERVAL_H: ${WHYFXPG_WORKER_INTERVAL_H:-6}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  pgdata:
  redisdata:
  s3data:
